version: "v0.4"

project:
  name: "Chvátal's and Pósa's degree conditions for Hamiltonian cycles"
  description: >-
    A Lean 4 / Mathlib formalization of two classical degree-sequence conditions for
    Hamiltonicity of a finite simple graph on n ≥ 3 vertices with degrees d₁ ≤ ⋯ ≤ dₙ. Chvátal's
    theorem (1972): if for every i < n/2, dᵢ ≤ i implies d_{n−i} ≥ n − i, then the graph is
    Hamiltonian (stated without sorting: if at least i vertices have degree at most i, then at
    least i + 1 vertices have degree at least n − i). Pósa's theorem (1962): if for every k with
    1 ≤ k < (n − 1)/2 fewer than k vertices have degree at most k, and, for odd n, at most
    (n − 1)/2 vertices have degree at most (n − 1)/2, then the graph is Hamiltonian. Mathlib has
    Hamiltonian cycles but neither theorem.
  authors:
    - "Juan Pablo Traverso Gianini"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Juan Pablo Traverso Gianini"

classification:
  arxiv: ["math.CO"]
  msc2020: ["05C45", "05C07"]

