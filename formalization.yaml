    type: "paper"
    location: "Magyar Tudományos Akadémia Matematikai Kutató Intézetének Közleményei 7 (1962), 225–226"
    relationship: "formalizes"
    note: "Pósa's degree condition for Hamiltonicity (no DOI)."
    license: "all rights reserved"
    author_endorsement: "n/a"
  - title: "A method in graph theory"
    authors:
