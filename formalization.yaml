      lean: "HamiltonDegree.chvatal"
      module: "Challenge"
      status: "proved"
    - source: "Pósa (1962): the degree condition implies Hamiltonicity"
      lean: "HamiltonDegree.posa"
      module: "Challenge"
      status: "proved"

