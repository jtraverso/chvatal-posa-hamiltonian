automation:
  methods:
    - method: "autonomous"
      models: ["Aristotle (Harmonic)"]
      framework: "Aristotle CLI"
      tool_setup: >-
        Produced all proofs in one run from the formal statements and a proof plan (the
        Bondy–Chvátal closure argument on top of the existing `MengerHamilton` library); the
        return was audited (statements and headers unchanged, no added axioms) and rebuilt
        locally.
      cost:
        wall_time: "under one hour"
        spend_usd: "not tracked"
        hardware: "API-only"
      prompting_notes: "Formal statements and proof plan supplied."
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude Code (Anthropic)"
      tool_setup: >-
        Statement design, proof plan, integration and review of the Aristotle return, and the
        Palomar packaging, checked with `lake build` and `#print axioms` (Lean v4.35.0-rc3,
        Mathlib c55e6e786f49471c72fbddbec5415808896aec1e).
      cost:
        wall_time: "about one hour"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "Natural-language instructions in Spanish, directed by the author."
  spend_usd: "subscription-based"
  notes: >-
    The results were chosen by the human author; the Lean proofs are AI-generated and
    mechanically verified (no `sorry`, axioms limited to propext, Classical.choice and Quot.sound,
    identical elaborated types for the Challenge/Solution pair).

fidelity:
  divergences: >-
    The degree-sequence conditions are stated without sorting the degrees. For Chvátal, "dᵢ ≤ i"
    is "at least i vertices have degree at most i" and "d_{n−i} ≥ n − i" is "at least i + 1
    vertices have degree at least n − i", for all i with 1 ≤ i and 2i < n; these are equivalent to
    the sorted conditions. For Pósa, "d_k > k for 1 ≤ k < (n − 1)/2" is "fewer than k vertices have
    degree at most k", and, for odd n, "d_{(n+1)/2} > (n − 1)/2" is "at most (n − 1)/2
    vertices have degree at most (n − 1)/2". Hamiltonicity is
    Mathlib's `SimpleGraph.IsHamiltonian` (a Hamiltonian cycle exists unless the graph has
    exactly one vertex); the hypothesis n ≥ 3 is explicit.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (AI agent in Claude Code, acting for the author)"
  notes: >-
    Agent review by Claude Opus 5.5, distinct from the mechanical verification: the agent
    compared the statements with Chvátal's and Pósa's theorems, checked the translation of the
    sorted degree conditions into counting form, checked that the Aristotle return left every
    statement and header unchanged, and confirmed by `lake build`, `#print axioms` and a
    comparison of the fully elaborated Challenge and Solution types that the proofs use no
    `sorry` and only propext, Classical.choice and Quot.sound. The author directed the work and
    approved the statements. No independent human mathematical review has been performed. The
    results are classical; no mathematical novelty is claimed.

alignment:
  namespace: "HamiltonDegree"
  statements:
